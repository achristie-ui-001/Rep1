<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>DRJVSBIRD</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; overflow:hidden; touch-action:none; user-select:none; }
canvas { display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
const CV = document.getElementById('c'), CX = CV.getContext('2d');
let W, H;
const resize = () => { W = CV.width = window.innerWidth; H = CV.height = window.innerHeight; };
resize(); window.addEventListener('resize', resize);

/* ══ PALETTE ════════════════════════════════════════════════════ */
const K = {
  bg:'#06061a', stars:'#ffffff', courtBg:'#0a0a28',
  floor:'#4a2000', floorL:'#6e3300', floorLine:'#994400',
  p1:'#1166ff', p1d:'#003399', p1eye:'#00ffcc',
  p2:'#ff2222', p2d:'#880000', p2eye:'#ffcc00',
  ball:'#ff8800', ballD:'#aa3300', ballLine:'#662200',
  hoop:'#ff3333', rim:'#cc1100', net:'#aaaaaa',
  white:'#ffffff', yellow:'#ffff00', green:'#00ff66',
  orange:'#ff6600', gray:'#445566', dgray:'#1a1a33',
  black:'#000000', scan:'rgba(0,0,20,0.18)',
};

/* ══ AUDIO ════════════════════════════════════════════════════ */
let _AC = null;
const getAC = () => { if(!_AC) try{_AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){} return _AC; };
const resume = () => { try{ const a=getAC(); if(a&&a.state==='suspended') a.resume(); }catch(e){} };
function note(f,d,type='square',vol=0.3,delay=0){
  const ac=getAC(); if(!ac) return;
  try{
    const o=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime+delay;
    o.connect(g); g.connect(ac.destination);
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(vol,t0);
    g.gain.exponentialRampToValueAtTime(0.001,t0+d);
    o.start(t0); o.stop(t0+d);
  }catch(e){}
}
const SFX = {
  tick:  ()=>note(440,.04,'square',.2),
  lock:  ()=>note(880,.07,'square',.3),
  shoot: ()=>{note(220,.06,'sawtooth',.3);note(160,.15,'sawtooth',.18,.05);},
  score: ()=>{[523,659,784,1047].forEach((f,i)=>note(f,.13,'square',.45,i*.07));},
  three: ()=>{[523,659,784,880,1047,1175].forEach((f,i)=>note(f,.1,'square',.4,i*.065));},
  miss:  ()=>{note(200,.1,'sawtooth',.35);note(150,.22,'sawtooth',.25,.08);},
  dunk:  ()=>{note(80,.06,'sawtooth',.6);note(60,.28,'sawtooth',.5,.05);[600,800,1000].forEach((f,i)=>note(f,.1,'square',.3,i*.06+.08));},
  select:()=>{note(440,.06,'square',.25);note(660,.06,'square',.2,.07);},
  menu:  ()=>[220,330,440,660].forEach((f,i)=>note(f,.07,'square',.3,i*.06)),
  win:   ()=>[523,659,784,880,1047,1319].forEach((f,i)=>note(f,.1,'square',.45,i*.08)),
  lose:  ()=>[330,294,262,220,196].forEach((f,i)=>note(f,.15,'sawtooth',.4,i*.1)),
  crowd: ()=>{for(let i=0;i<10;i++) note(100+Math.random()*400,.2+Math.random()*.3,'sine',.04,i*.025);},
};

/* ══ FONT ═════════════════════════════════════════════════════ */
const FONT = (sz) => `bold ${sz}px 'Press Start 2P','Courier New',monospace`;
function lbl(str,x,y,sz,col,align='center'){
  CX.font=FONT(sz); CX.textAlign=align; CX.textBaseline='top';
  CX.fillStyle=K.black; CX.fillText(str,x+2,y+2);
  CX.fillStyle=col; CX.fillText(str,x,y);
}
function lblc(str,x,y,sz,col){
  CX.font=FONT(sz); CX.textAlign='center'; CX.textBaseline='middle';
  CX.fillStyle=K.black; CX.fillText(str,x+2,y+2);
  CX.fillStyle=col; CX.fillText(str,x,y);
}

/* ══ GAME DATA ══════════════════════════════════════════════════ */
const CPUS = [
  {name:'LAW-BRAWN', col:K.p2, dark:K.p2d, eye:'#ffcc00', acc:.65,
   win:["WITNESS IT!","THE KING!","TOO EASY!","CHOSEN 1!"],
   loss:["HEADBAND!","LET U HAVE","NEXT TIME!"]},
  {name:'CURRY-3',   col:'#1144cc', dark:'#001177', eye:'#ffff00', acc:.72,
   win:["NIGHT NIGHT","SPLASH!","STEP BACK!","MVP SZN!"],
   loss:["MOUTHGRD!","THE WIND!","MEANT 2 DO"]},
  {name:'SHAQ-BOT',  col:'#cc2200', dark:'#661100', eye:'#00ccff', acc:.58,
   win:["SHAQ ATTK!","DIESEL!","SUPERMAN!","BOOM!"],
   loss:["FREE THROW","BRICK CITY","CLOSE NUF!"]},
  {name:'DUR-ANT',   col:'#0055bb', dark:'#002266', eye:'#ff8800', acc:.70,
   win:["EZ MONEY!","BUCKET!","7 FOOTER!","SNAKE MODE"],
   loss:["THE ANT!","BLAME KNEE","BURNER MODE"]},
];

/* ══ LAYOUT ═════════════════════════════════════════════════════ */
const L = () => ({
  hoopX: W*.67, hoopY: H*.35, hoopR: Math.min(W,H)*.042,
  floorY: H*.78,
  pX: W*.18, pY: H*.72,
  cX: W*.84, cY: H*.72,
  courtTop: H*.13,
});

/* ══ PARTICLES ══════════════════════════════════════════════════ */
let PARTS = [];
function burst(x,y,n=20,cols=[K.yellow,K.orange,K.green,K.white]){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=Math.random()*10+3;
    PARTS.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,
      size:Math.random()*10+4,col:cols[~~(Math.random()*cols.length)],life:1,rv:(Math.random()-.5)*.3});
  }
}
function tickParts(){ PARTS=PARTS.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.life-=.02;return p.life>0;}); }
function drawParts(){
  PARTS.forEach(p=>{ CX.save();CX.globalAlpha=p.life;CX.fillStyle=p.col;CX.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);CX.restore(); });
}

/* ══ DRAW COURT ═══════════════════════════════════════════════════ */
let STARS_CACHE = null;
function drawCourt(){
  const l=L();
  CX.fillStyle=K.bg; CX.fillRect(0,0,W,H);
  if(!STARS_CACHE) STARS_CACHE=Array.from({length:40},()=>({x:Math.random()*W,y:Math.random()*H*.5,r:Math.random()*1.5+.5,ph:Math.random()*6}));
  const t=Date.now()*.001;
  STARS_CACHE.forEach(s=>{
    CX.fillStyle=`rgba(255,255,255,${.2+.8*Math.abs(Math.sin(t+s.ph))})`;
    CX.fillRect(s.x,s.y,s.r*2,s.r*2);
  });
  CX.fillStyle=K.courtBg; CX.fillRect(0,l.courtTop,W,l.floorY-l.courtTop);
  CX.fillStyle='#0d0d24'; CX.fillRect(0,l.courtTop,W,(l.floorY-l.courtTop)*.4);
  const headSz=Math.max(6,Math.floor(W/40));
  for(let i=0;i<20;i++){
    const cx=( i+.5)*W/20, cy=l.courtTop+(l.floorY-l.courtTop)*.25;
    const col=i%3===0?'#440044':i%3===1?'#003344':'#444400';
    CX.fillStyle=col; CX.fillRect(cx-headSz,cy,headSz*2,headSz*2);
    CX.fillRect(cx-headSz*.7,cy-headSz*1.6,headSz*1.4,headSz*1.4);
    if(G.flash&&Date.now()-G.flash<800){
      CX.fillStyle=col; CX.fillRect(cx-headSz*1.5,cy-headSz*.5,headSz*.8,headSz*.8);
    }
  }
  CX.fillStyle=K.floorL; CX.fillRect(0,l.floorY,W,H-l.floorY);
  CX.fillStyle=K.floor; CX.fillRect(0,l.floorY,W,4);
  for(let i=0;i<8;i++){
    CX.fillStyle=i%2?K.floorL:K.floor;
    CX.fillRect(0,l.floorY+4+i*Math.floor((H-l.floorY-4)/8),W,Math.floor((H-l.floorY-4)/8));
  }
  CX.fillStyle=K.floorLine;
  CX.fillRect(0,l.floorY,W,3);
  const arc3 = W*.32;
  CX.strokeStyle='rgba(255,180,50,.25)'; CX.lineWidth=2; CX.setLineDash([8,8]);
  CX.beginPath(); CX.arc(l.hoopX,l.floorY,arc3,Math.PI,0,true); CX.stroke();
  CX.setLineDash([]);
}

/* ══ DRAW HOOP ════════════════════════════════════════════════════ */
function drawHoop(){
  const l=L(), {hoopX:hx,hoopY:hy,hoopR:hr,floorY:fy}=l;
  CX.fillStyle='#666677';
  CX.fillRect(hx+hr*1.6-4,hy,8,fy-hy);
  CX.fillStyle='#ccccdd';
  CX.fillRect(hx+hr*1.4,hy-hr*2.5,hr*.55,hr*4.5);
  CX.fillStyle='#aaaacc';
  CX.fillRect(hx+hr*1.4+2,hy-hr*2.5+2,hr*.55-4,hr*4.5-4);
  CX.fillStyle='#ff4444';
  CX.strokeStyle='#ff4444'; CX.lineWidth=2;
  const bx=hx+hr*1.4+4, by=hy-hr*.8, bw=hr*.45-8, bh=hr*1.6;
  CX.strokeRect(bx,by,bw,bh);
  CX.fillStyle='#666677';
  CX.fillRect(hx,hy-4,hr*1.42,8);
  for(let i=0;i<=4;i++){
    const nx=hx-hr+(i/4)*hr*2;
    const ny2=hy+hr*.25+hr*1.8;
    const nx2=hx-hr*.4+(i/4)*hr*.8;
    CX.strokeStyle='rgba(200,200,200,.5)'; CX.lineWidth=1.5;
    CX.beginPath(); CX.moveTo(nx,hy); CX.lineTo(nx2,ny2); CX.stroke();
  }
  for(let i=0;i<4;i++){
    const yo=hy+(i+1)*hr*.45;
    const sp=hr*(1-i*.2);
    CX.strokeStyle='rgba(200,200,200,.35)'; CX.lineWidth=1.5;
    CX.beginPath(); CX.moveTo(hx-sp*.8,yo); CX.lineTo(hx+sp*.8,yo); CX.stroke();
  }
  CX.strokeStyle=K.hoop; CX.lineWidth=Math.max(4,hr*.28);
  CX.beginPath(); CX.arc(hx,hy,hr,0,Math.PI*2); CX.stroke();
  CX.strokeStyle=K.rim; CX.lineWidth=2;
  CX.beginPath(); CX.arc(hx,hy,hr,0,Math.PI*2); CX.stroke();
}

/* ══ DRAW PLAYER ══════════════════════════════════════════════════ */
function drawPlayer(cx,cy,col,darkCol,eyeCol,anim,num){
  const s=Math.min(W,H)*.085;
  const dy = anim==='happy' ? Math.sin(Date.now()*.015)*4 : anim==='shoot' ? -s*.12 : 0;
  cy+=dy;
  CX.fillStyle='rgba(0,0,0,.4)';
  CX.fillRect(cx-s*.35,cy+s*.95,s*.7,s*.08);
  CX.fillStyle=darkCol;
  CX.fillRect(cx-s*.22,cy+s*.6,s*.18,s*.38);
  CX.fillRect(cx+s*.04,cy+s*.6,s*.18,s*.38);
  CX.fillStyle='#222233';
  CX.fillRect(cx-s*.28,cy+s*.95,s*.24,s*.1);
  CX.fillRect(cx+s*.04,cy+s*.95,s*.24,s*.1);
  CX.fillStyle=col;
  CX.fillRect(cx-s*.28,cy+s*.1,s*.56,s*.54);
  CX.font=FONT(Math.max(7,s*.22));
  CX.textAlign='center'; CX.textBaseline='middle';
  CX.fillStyle=K.yellow;
  CX.fillText(num, cx, cy+s*.38);
  CX.fillStyle=K.yellow;
  CX.fillRect(cx-s*.28,cy+s*.1,s*.56,s*.09);
  if(anim==='shoot'){
    CX.fillStyle=col;
    CX.fillRect(cx+s*.28,cy+s*.12,s*.28,s*.14);
    CX.fillRect(cx+s*.42,cy-s*.04,s*.14,s*.18);
    CX.fillRect(cx-s*.56,cy+s*.18,s*.28,s*.14);
  } else if(anim==='happy'){
    CX.fillStyle=col;
    CX.fillRect(cx+s*.28,cy+s*.1,s*.28,s*.14);
    CX.fillRect(cx+s*.42,cy-s*.08,s*.14,s*.2);
    CX.fillRect(cx-s*.56,cy+s*.1,s*.28,s*.14);
    CX.fillRect(cx-s*.56,cy-s*.08,s*.14,s*.2);
  } else {
    CX.fillStyle=col;
    CX.fillRect(cx+s*.28,cy+s*.2,s*.26,s*.12);
    CX.fillRect(cx-s*.54,cy+s*.2,s*.26,s*.12);
  }
  CX.fillStyle=col;
  CX.fillRect(cx-s*.26,cy-s*.38,s*.52,s*.5);
  CX.fillStyle=K.yellow;
  CX.fillRect(cx-s*.26,cy-s*.38,s*.52,s*.1);
  CX.fillStyle=K.yellow;
  CX.fillRect(cx-s*.04,cy-s*.38,s*.08,s*.18);
  CX.fillRect(cx-s*.1,cy-s*.56,s*.2,s*.1);
  if(anim==='sad'){
    CX.fillStyle='#ff3333';
    CX.fillRect(cx-s*.18,cy-s*.2,s*.12,s*.12);
    CX.fillRect(cx+s*.06,cy-s*.2,s*.12,s*.12);
    CX.fillStyle=K.black;
    CX.fillRect(cx-s*.14,cy-s*.16,s*.04,s*.04);
    CX.fillRect(cx+s*.1,cy-s*.16,s*.04,s*.04);
  } else if(anim==='happy'){
    CX.fillStyle=eyeCol;
    CX.fillRect(cx-s*.2,cy-s*.18,s*.14,s*.06);
    CX.fillRect(cx+s*.06,cy-s*.18,s*.14,s*.06);
    CX.fillRect(cx-s*.16,cy-s*.24,s*.06,s*.06);
    CX.fillRect(cx+s*.1,cy-s*.24,s*.06,s*.06);
  } else {
    CX.fillStyle=eyeCol;
    CX.fillRect(cx-s*.2,cy-s*.22,s*.14,s*.12);
    CX.fillRect(cx+s*.06,cy-s*.22,s*.14,s*.12);
    CX.fillStyle=K.black;
    CX.fillRect(cx-s*.14,cy-s*.18,s*.06,s*.06);
    CX.fillRect(cx+s*.1,cy-s*.18,s*.06,s*.06);
  }
  if(anim!=='sad'){
    CX.fillStyle=K.black;
    CX.fillRect(cx-s*.12,cy-s*.04,s*.24,s*.06);
    CX.fillStyle='#ff9999';
    CX.fillRect(cx-s*.08,cy-s*.04,s*.16,s*.04);
  }
}

/* ══ DRAW BALL ════════════════════════════════════════════════════ */
let TRAIL = [];
function drawBall(x,y,r,spin){
  TRAIL.forEach((pt,i)=>{
    const age=(i+1)/TRAIL.length;
    CX.globalAlpha=age*.5;
    CX.fillStyle=i%2?K.ball:K.orange;
    CX.beginPath(); CX.arc(pt.x,pt.y,r*(.3+age*.5),0,Math.PI*2); CX.fill();
  });
  CX.globalAlpha=1;
  CX.fillStyle=K.ballD;
  CX.beginPath(); CX.arc(x,y,r,0,Math.PI*2); CX.fill();
  CX.fillStyle=K.ball;
  CX.beginPath(); CX.arc(x,y,r*.88,0,Math.PI*2); CX.fill();
  CX.strokeStyle=K.ballLine; CX.lineWidth=2;
  CX.save(); CX.translate(x,y); CX.rotate(spin);
  CX.beginPath(); CX.moveTo(-r*.88,0); CX.lineTo(r*.88,0); CX.stroke();
  CX.beginPath(); CX.moveTo(0,-r*.88); CX.lineTo(0,r*.88); CX.stroke();
  CX.beginPath(); CX.arc(0,0,r*.5,-.8,.8); CX.stroke();
  CX.beginPath(); CX.arc(0,0,r*.5,Math.PI-.8,Math.PI+.8); CX.stroke();
  CX.restore();
  CX.fillStyle='rgba(255,255,200,.6)';
  CX.fillRect(x-r*.25,y-r*.45,r*.2,r*.2);
}

/* ══ HUD ══════════════════════════════════════════════════════ */
function drawHUD(){
  CX.fillStyle='#0a0a22';
  CX.fillRect(0,0,W,H*.12);
  CX.fillStyle='#222244';
  CX.fillRect(0,H*.12-3,W,3);
  const sz=Math.min(H*.028, W*.04);
  const pName = G.playerName || 'YOU';
  lblc(pName, W*.22, H*.04, sz, G.pc.col);
  lblc(String(G.pScore), W*.22, H*.085, sz*1.4, K.yellow);
  lblc('VS', W*.5, H*.06, sz*.9, K.gray);
  lblc(G.cpu.name, W*.78, H*.04, sz, G.cpu.col);
  lblc(String(G.cScore), W*.78, H*.085, sz*1.4, K.yellow);
  const shot=Math.min(G.pShots+(G.turn==='cpu'?1:0),5);
  lblc('SHOT '+shot+'/5', W*.5, H*.09, sz*.75, K.gray);
}

/* ══ ANGLE METER ══════════════════════════════════════════════════ */
function drawAngleMeter(){
  const l=L();
  const meterH = H*.08, meterY = H*.84;
  const meterW = Math.min(W*.7,380), meterX = W/2-meterW/2;
  lblc('SET ANGLE', W/2, meterY-H*.04, H*.022, K.white);
  CX.fillStyle='#111128'; CX.fillRect(meterX,meterY,meterW,meterH);
  CX.strokeStyle='#333355'; CX.lineWidth=2; CX.strokeRect(meterX,meterY,meterW,meterH);
  const zones=[
    [0,.15,K.p2d],[.15,.28,'#884400'],[.28,.42,'#226622'],
    [.42,.58,K.green],
    [.58,.72,'#226622'],[.72,.85,'#884400'],[.85,1,K.p2d]
  ];
  zones.forEach(([s,e,c])=>{
    CX.fillStyle=c; CX.fillRect(meterX+s*meterW,meterY,(e-s)*meterW,meterH);
  });
  CX.font=FONT(Math.max(7,meterH*.35)); CX.textAlign='center'; CX.textBaseline='middle';
  CX.fillStyle=K.black; CX.fillText('SWEET',W/2+1,meterY+meterH/2+1);
  CX.fillStyle=K.yellow; CX.fillText('SWEET',W/2,meterY+meterH/2);
  const cx2=meterX+G.anglePos*meterW;
  CX.fillStyle=K.white;
  CX.fillRect(cx2-6,meterY-16,12,20);
  CX.fillRect(cx2-12,meterY-8,24,6);
  const p=.65+.35*Math.sin(Date.now()*.01);
  CX.globalAlpha=p;
  lblc('TAP / SPACE', W/2, meterY+meterH+H*.025, H*.024, K.yellow);
  CX.globalAlpha=1;
  const angle = Math.PI/2 - G.anglePos * Math.PI * .55 - Math.PI*.05;
  const len=Math.min(W,H)*.28;
  const px2=l.pX, py2=l.pY-Math.min(W,H)*.085*.6;
  CX.strokeStyle=K.yellow; CX.lineWidth=3; CX.setLineDash([8,6]);
  CX.beginPath(); CX.moveTo(px2,py2); CX.lineTo(px2+Math.cos(angle)*len, py2-Math.sin(angle)*len); CX.stroke();
  CX.setLineDash([]);
  const ex=px2+Math.cos(angle)*len, ey=py2-Math.sin(angle)*len;
  CX.fillStyle=K.yellow;
  CX.fillRect(ex-5,ey-5,10,10);
}

/* ══ POWER METER ══════════════════════════════════════════════════ */
function drawPowerMeter(){
  const meterH=H*.08, meterY=H*.84;
  const meterW=Math.min(W*.7,380), meterX=W/2-meterW/2;
  lblc('SET POWER', W/2, meterY-H*.04, H*.022, K.white);
  CX.fillStyle='#111128'; CX.fillRect(meterX,meterY,meterW,meterH);
  CX.strokeStyle='#333355'; CX.lineWidth=2; CX.strokeRect(meterX,meterY,meterW,meterH);
  const pw=G.powerPos*meterW;
  const col=G.powerPos<.3?'#cc4400':G.powerPos<.5?'#cc8800':G.powerPos<.7?K.green:'#88ff00';
  CX.fillStyle=col; CX.fillRect(meterX,meterY,pw,meterH);
  for(let i=0;i<Math.floor(G.powerPos*12);i++){
    CX.fillStyle=i%2?col:'rgba(255,255,255,.15)';
    CX.fillRect(meterX+i*(meterW/12)+1,meterY+1,meterW/12-2,meterH-2);
  }
  const pct=Math.round(G.powerPos*100);
  CX.font=FONT(Math.max(7,meterH*.35)); CX.textAlign='center'; CX.textBaseline='middle';
  CX.fillStyle=K.black; CX.fillText(pct+'%',W/2+1,meterY+meterH/2+1);
  CX.fillStyle=K.white; CX.fillText(pct+'%',W/2,meterY+meterH/2);
  CX.fillStyle=K.white;
  CX.fillRect(meterX+pw-3,meterY-8,6,meterH+16);
  const p=.65+.35*Math.sin(Date.now()*.01);
  CX.globalAlpha=p;
  lblc('TAP / SPACE', W/2, meterY+meterH+H*.025, H*.024, K.yellow);
  CX.globalAlpha=1;
}

/* ══ MESSAGE ══════════════════════════════════════════════════════ */
function drawMsg(){
  if(!G.msg||G.msgTimer<=0) return;
  const alpha=Math.min(1,G.msgTimer/20);
  CX.save(); CX.globalAlpha=alpha;
  const sz=Math.min(H*.065,W*.07);
  CX.font=FONT(sz); CX.textAlign='center'; CX.textBaseline='middle';
  CX.fillStyle=K.black; CX.fillText(G.msg,W/2+3,H*.52+3);
  CX.fillStyle=G.msgCol; CX.fillText(G.msg,W/2,H*.52);
  CX.restore();
  G.msgTimer--;
}
function setMsg(s,col){G.msg=s;G.msgCol=col||K.white;G.msgTimer=90;}

/* ══ SCANLINES ════════════════════════════════════════════════════ */
function drawScanlines(){
  CX.fillStyle=K.scan;
  for(let y=0;y<H;y+=4) CX.fillRect(0,y,W,2);
}

/* ══ STATE ══════════════════════════════════════════════════════ */
let G = { screen:'NAME_SELECT', pShots:0,cShots:0,pScore:0,cScore:0 };
G.pc = CPUS[0];
G.cpu = CPUS[0];
G.playerName = 'YOU';

function startGame(playerName, cpuIdx){
  const cpu=CPUS[cpuIdx];
  G={
    screen:'PLAYING', playerName, cpu, cpuIdx,
    pc:{col:playerName==='JONNY'?'#00aa55':'#1166ff', dark:playerName==='JONNY'?'#005533':'#003399', eye:playerName==='JONNY'?'#88ffff':'#00ffcc'},
    pScore:0, cScore:0, pShots:0, cShots:0,
    turn:'player', phase:'ANGLE',
    anglePos:.5, angleDir:1, angleSpeed:.012,
    powerPos:0,  powerDir:1, powerSpeed:.014,
    lockedAngle:.5, lockedPower:.5,
    ball:null, ballSpin:0,
    timer:0, msg:'', msgCol:K.white, msgTimer:0,
    pAnim:'idle', cAnim:'idle',
    flash:null,
  };
  TRAIL=[]; PARTS=[];
  SFX.menu();
}

/* ══ BALL ════════════════════════════════════════════════════════ */
function launchBall(angle, power, forCpu){
  const l=L();
  const sx = forCpu ? l.cX-W*.04 : l.pX+W*.04;
  const sy = forCpu ? l.cY-Math.min(W,H)*.085*.5 : l.pY-Math.min(W,H)*.085*.5;
  const aQ = Math.abs(angle-.5)*2;
  const pQ = Math.abs(power-.5)*2;
  const quality = (aQ + pQ)/2;
  const hit = quality < .45 + (forCpu ? G.cpu.acc*.1 : 0);
  const miss3pt = !forCpu && angle < .25;
  const pts = hit ? (miss3pt ? 3 : 2) : 0;
  const offX = hit ? 0 : (quality>.7?(Math.random()-.5)*l.hoopR*5:(Math.random()-.5)*l.hoopR*2.5);
  const offY = hit ? 0 : (Math.random()-.5)*l.hoopR*3;
  const tx = l.hoopX+offX, ty = l.hoopY+offY;
  const arcH = (forCpu ? .45 : .35+angle*.4);
  const midX=(sx+tx)/2, midY=Math.min(sy,ty)-Math.min(W,H)*arcH;
  TRAIL=[];
  G.ball={sx,sy,tx,ty,px:midX,py:midY,t:0,spd:.025,hit,pts,forCpu,done:false};
  G.ballSpin=0;
  G.phase='FLYING';
  G.pAnim = forCpu ? 'idle' : 'shoot';
  G.cAnim = forCpu ? 'shoot' : 'idle';
  SFX.shoot();
}

function tickBall(){
  if(!G.ball||G.ball.done) return;
  const b=G.ball;
  b.t+=b.spd; G.ballSpin+=.12;
  const pos=getBPos();
  if(pos){ TRAIL.push({x:pos.x,y:pos.y}); if(TRAIL.length>16) TRAIL.shift(); }
  if(b.t>=1){
    b.done=true; TRAIL=[];
    const l=L();
    if(b.hit){
      burst(l.hoopX,l.hoopY,28);
      G.flash=Date.now();
      if(b.forCpu){
        G.cScore+=b.pts; G.cAnim='happy';
        const qs=G.cpu.win; setMsg(qs[~~(Math.random()*qs.length)],G.cpu.col);
        b.pts===3?SFX.three():SFX.score(); SFX.crowd();
      } else {
        G.pScore+=b.pts; G.pAnim='happy';
        setMsg(b.pts===3?'3 POINTER!!':'SWISH!',b.pts===3?K.yellow:K.green);
        b.pts===3?SFX.three():SFX.score(); SFX.crowd();
      }
    } else {
      burst(l.hoopX+(Math.random()-.5)*50,l.hoopY+(Math.random()-.5)*30,8,[K.p2,'#884400',K.gray]);
      if(b.forCpu){
        G.cAnim='sad'; const qs=G.cpu.loss; setMsg(qs[~~(Math.random()*qs.length)],K.gray);
      } else {
        G.pAnim='sad'; setMsg('BRICK!',K.p2);
      }
      SFX.miss();
    }
    setTimeout(()=>{ G.ball=null; TRAIL=[]; G.pAnim='idle'; G.cAnim='idle'; nextTurn(); },1300);
  }
}

function getBPos(){
  if(!G.ball) return null;
  const{sx,sy,px,py,tx,ty,t}=G.ball;
  return{x:(1-t)*(1-t)*sx+2*(1-t)*t*px+t*t*tx, y:(1-t)*(1-t)*sy+2*(1-t)*t*py+t*t*ty};
}

/* ══ TURNS ══════════════════════════════════════════════════════ */
function nextTurn(){
  G.phase='ANGLE'; G.anglePos=.5; G.powerPos=0;
  if(G.pShots>=5&&G.cShots>=5){ setTimeout(()=>G.screen='GAMEOVER',600); return; }
  if(G.turn==='player'){ G.turn='cpu'; G.screen='CPU_TURN'; G.cpuTimer=80; }
  else { G.turn='player'; G.screen='PLAYING'; }
}

function cpuTakesShot(){
  G.cShots++;
  const angle=.35+Math.random()*.3;
  const power=.35+Math.random()*.3;
  launchBall(angle,power,true);
  G.screen='PLAYING';
}

/* ══ INPUT ══════════════════════════════════════════════════════ */
let _mx=null;
CV.addEventListener('mousemove',e=>_mx={x:e.clientX,y:e.clientY});

function tap(x,y){
  resume();
  const s=G.screen;
  if(s==='NAME_SELECT'){
    const bw=Math.min(W*.38,200),bh=H*.15,gap=W*.06;
    const sx=(W-bw*2-gap)/2;
    if(y>=H*.42&&y<=H*.42+bh){
      if(x>=sx&&x<=sx+bw)         { SFX.select(); startGame('AUSTIN',G._cpuIdx||0); }
      if(x>=sx+bw+gap&&x<=sx+bw*2+gap){ SFX.select(); startGame('JONNY',G._cpuIdx||0); }
    }
    return;
  }
  if(s==='CPU_SELECT'){
    const cw=Math.min(W*.42,200), ch=H*.2, gap=W*.04;
    const sx2=(W-cw*2-gap)/2;
    [[0,sx2,H*.38],[1,sx2+cw+gap,H*.38],[2,sx2,H*.62],[3,sx2+cw+gap,H*.62]].forEach(([i,bx,by])=>{
      if(x>=bx&&x<=bx+cw&&y>=by&&y<=by+ch){ SFX.select(); G._cpuIdx=i; G.screen='NAME_SELECT'; }
    });
    return;
  }
  if(s==='PLAYING'){
    if(G.phase==='ANGLE'){
      G.lockedAngle=G.anglePos; G.phase='POWER'; G.powerPos=0; G.powerDir=1;
      SFX.lock();
    } else if(G.phase==='POWER'){
      G.lockedPower=G.powerPos;
      G.pShots++;
      launchBall(G.lockedAngle, G.lockedPower, false);
    }
    return;
  }
  if(s==='GAMEOVER'){ G.screen='NAME_SELECT'; SFX.menu(); }
}

CV.addEventListener('click', e=>tap(e.clientX,e.clientY));
CV.addEventListener('touchstart',e=>{ e.preventDefault(); resume(); const t=e.touches[0]; tap(t.clientX,t.clientY); },{passive:false});
document.addEventListener('keydown',e=>{
  resume();
  if(e.code==='Space'||e.code==='Enter'){ e.preventDefault(); tap(W/2,H/2); }
  if(G.screen==='NAME_SELECT'||G.screen==='CPU_SELECT'){
    if(e.key==='a'||e.key==='A'){ SFX.select(); startGame('AUSTIN',G._cpuIdx||0); }
    if(e.key==='j'||e.key==='J'){ SFX.select(); startGame('JONNY',G._cpuIdx||0); }
    if(e.key>='1'&&e.key<='4')  { SFX.select(); G._cpuIdx=parseInt(e.key)-1; G.screen='NAME_SELECT'; }
  }
});

/* ══ SCREENS ════════════════════════════════════════════════════ */
function drawNameSelect(){
  drawCourt(); drawHoop();
  const sc=1+.03*Math.sin(Date.now()*.003);
  CX.save(); CX.translate(W/2,H*.22); CX.scale(sc,sc);
  lblc('DRJVSBIRD',0,0,Math.min(H*.07,W*.075),K.orange);
  CX.restore();
  lblc('8-BIT HOOPS',W/2,H*.28,Math.min(H*.025,W*.022),K.yellow);
  lblc('PICK YOUR PLAYER',W/2,H*.36,Math.min(H*.022,W*.02),K.white);
  const bw=Math.min(W*.38,200), bh=H*.15, gap=W*.06;
  const sx=(W-bw*2-gap)/2;
  const opts=[
    {name:'AUSTIN',x:sx,     col:'#1166ff'},
    {name:'JONNY', x:sx+bw+gap, col:'#00aa55'},
  ];
  opts.forEach((o,i)=>{
    const hov=_mx&&_mx.x>=o.x&&_mx.x<=o.x+bw&&_mx.y>=H*.42&&_mx.y<=H*.42+bh;
    CX.fillStyle=hov?o.col:o.col+'88'; CX.fillRect(o.x,H*.42,bw,bh);
    CX.strokeStyle=hov?K.white:o.col; CX.lineWidth=3; CX.strokeRect(o.x,H*.42,bw,bh);
    lblc(o.name, o.x+bw/2, H*.42+bh/2, Math.min(bh*.22,18), K.white);
    lblc('['+o.name[0]+']', o.x+bw/2, H*.42+bh*.72, Math.min(bh*.16,13), K.yellow);
  });
  drawPlayer(W*.22,H*.7,opts[0].col,'#003399','#00ffcc','idle','1');
  drawPlayer(W*.78,H*.7,opts[1].col,'#005533','#88ffff','idle','2');
  const cpuName = CPUS[G._cpuIdx||0].name;
  lblc('VS: '+cpuName,W/2,H*.78,Math.min(H*.02,W*.018),K.gray);
  lblc('TAP TO CHANGE',W/2,H*.83,Math.min(H*.016,W*.015),K.dgray);
  const p=.6+.4*Math.sin(Date.now()*.007);
  CX.globalAlpha=p; lblc('TAP NAME TO PLAY',W/2,H*.9,Math.min(H*.02,W*.018),K.white); CX.globalAlpha=1;
  if(_mx&&_mx.y>=H*.77&&_mx.y<=H*.85){
    CX.fillStyle='rgba(255,255,255,.05)'; CX.fillRect(W*.2,H*.77,W*.6,H*.07);
  }
}

CV.addEventListener('click',e=>{
  if(G.screen==='NAME_SELECT'&&e.clientY>=H*.77&&e.clientY<=H*.85){
    G.screen='CPU_SELECT'; SFX.menu();
  }
});
CV.addEventListener('touchstart',e=>{
  const t=e.touches[0];
  if(G.screen==='NAME_SELECT'&&t.clientY>=H*.77&&t.clientY<=H*.85){
    e.preventDefault(); G.screen='CPU_SELECT'; SFX.menu();
  }
},{passive:false});

function drawCpuSelect(){
  drawCourt();
  lblc('PICK OPPONENT',W/2,H*.18,Math.min(H*.032,W*.028),K.orange);
  const cw=Math.min(W*.42,200), ch=H*.2, gap=W*.04;
  const sx=(W-cw*2-gap)/2;
  CPUS.forEach((cpu,i)=>{
    const bx=(i%2===0)?sx:sx+cw+gap;
    const by=(i<2)?H*.28:H*.54;
    const hov=_mx&&_mx.x>=bx&&_mx.x<=bx+cw&&_mx.y>=by&&_mx.y<=by+ch;
    CX.fillStyle=hov?cpu.col:cpu.col+'77'; CX.fillRect(bx,by,cw,ch);
    CX.strokeStyle=hov?K.white:cpu.dark; CX.lineWidth=3; CX.strokeRect(bx,by,cw,ch);
    lblc(cpu.name, bx+cw/2, by+ch*.3, Math.min(cw*.12,12), K.white);
    const diffLbl=cpu.acc>=.70?'HARD':cpu.acc>=.62?'MED':'EASY';
    const diffCol=cpu.acc>=.70?K.p2:cpu.acc>=.62?K.orange:K.green;
    lblc(diffLbl, bx+cw/2, by+ch*.62, Math.min(cw*.13,12), diffCol);
    lblc('['+String(i+1)+']', bx+cw/2, by+ch*.82, Math.min(cw*.11,11), K.yellow);
  });
  const p=.6+.4*Math.sin(Date.now()*.008);
  CX.globalAlpha=p; lblc('TAP TO SELECT',W/2,H*.84,Math.min(H*.022,W*.02),K.white); CX.globalAlpha=1;
}

function drawGameScreen(){
  const l=L();
  drawCourt(); drawHoop();
  if(G.flash&&Date.now()-G.flash<300){
    CX.fillStyle='rgba(255,255,100,.15)'; CX.fillRect(0,0,W,H);
  }
  const pNum=G.playerName==='JONNY'?'11':'23';
  drawPlayer(l.pX,l.pY, G.pc.col,G.pc.dark,G.pc.eye, G.pAnim, pNum);
  drawPlayer(l.cX,l.cY, G.cpu.col,G.cpu.dark,G.cpu.eye, G.cAnim, '00');
  const bp=getBPos();
  if(bp){ const r=Math.min(W,H)*.036; drawBall(bp.x,bp.y,r,G.ballSpin); }
  drawParts(); drawHUD(); drawMsg();
}

function drawGameOver(){
  drawCourt(); drawHoop();
  const won=G.pScore>G.cScore, tied=G.pScore===G.cScore;
  CX.fillStyle='rgba(0,0,20,.85)'; CX.fillRect(W*.05,H*.1,W*.9,H*.68);
  CX.strokeStyle=K.yellow; CX.lineWidth=3; CX.strokeRect(W*.05,H*.1,W*.9,H*.68);
  const sz=Math.min(H*.065,W*.08);
  if(tied)      lblc('TIE GAME!',W/2,H*.22,sz,K.yellow);
  else if(won){ lblc('YOU WIN!',W/2,H*.22,sz,K.green); burst(W/2,H*.22,5); }
  else          lblc('CPU WINS!',W/2,H*.22,sz,K.p2);
  const sc=Math.min(H*.045,W*.055);
  lblc(G.playerName+': '+G.pScore,W/2,H*.36,sc,G.pc.col);
  lblc(G.cpu.name+': '+G.cScore,W/2,H*.47,sc,G.cpu.col);
  const pNum=G.playerName==='JONNY'?'11':'23';
  drawPlayer(W*.25,H*.72,G.pc.col,G.pc.dark,G.pc.eye,won?'happy':'sad',pNum);
  drawPlayer(W*.75,H*.72,G.cpu.col,G.cpu.dark,G.cpu.eye,won?'sad':'happy','00');
  const p=.6+.4*Math.sin(Date.now()*.008);
  CX.globalAlpha=p; lblc('TAP TO PLAY AGAIN',W/2,H*.87,Math.min(H*.026,W*.022),K.white); CX.globalAlpha=1;
  drawParts();
}

/* ══ MAIN LOOP ════════════════════════════════════════════════════ */
function loop(){
  requestAnimationFrame(loop);
  try {
    CX.clearRect(0,0,W,H);
    switch(G.screen){
      case 'NAME_SELECT': drawNameSelect(); break;
      case 'CPU_SELECT':  drawCpuSelect();  break;
      case 'PLAYING': {
        if(G.phase==='ANGLE'){
          G.anglePos+=G.aimDir*G.angleSpeed;
          if(G.anglePos>=1){G.anglePos=1;G.aimDir=-1;}
          if(G.anglePos<=0){G.anglePos=0;G.aimDir=1;}
        } else if(G.phase==='POWER'){
          G.powerPos+=G.powerDir*G.powerSpeed;
          if(G.powerPos>=1){G.powerPos=1;G.powerDir=-1;}
          if(G.powerPos<=0){G.powerPos=0;G.powerDir=1;}
        }
        drawGameScreen();
        if(G.phase==='ANGLE') drawAngleMeter();
        else if(G.phase==='POWER') drawPowerMeter();
        break;
      }
      case 'FLYING':
        tickBall(); tickParts();
        drawGameScreen();
        break;
      case 'CPU_TURN': {
        G.cpuTimer--;
        if(G.cpuTimer<=0) cpuTakesShot();
        drawGameScreen();
        const p3=.65+.35*Math.sin(Date.now()*.01);
        CX.globalAlpha=p3;
        lblc(G.cpu.name+' AIMS...',W/2,H*.88,Math.min(H*.028,W*.024),G.cpu.col);
        CX.globalAlpha=1;
        break;
      }
      case 'GAMEOVER':
        tickParts(); drawGameOver();
        break;
    }
    drawScanlines();
  } catch(err){
    CX.fillStyle='#fff'; CX.fillRect(0,0,W,H);
    CX.fillStyle='#c00'; CX.font='bold 18px monospace'; CX.textAlign='left'; CX.textBaseline='top';
    CX.fillText('ERROR: '+err.message,16,20);
    (err.stack||'').split('\n').slice(0,8).forEach((l,i)=>{
      CX.fillStyle='#333'; CX.font='12px monospace'; CX.fillText(l,16,50+i*16);
    });
  }
}

G._cpuIdx = 0;
G.screen = 'NAME_SELECT';
requestAnimationFrame(loop);
</script>
